name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        if: matrix.node == '24'
      # The browser tests need jsdom, which requires Node 22.22+; the browser package itself runs in browsers.
      - run: npm test -w packages/core -w packages/node
        if: matrix.node == '20'
      - run: npm run test:react18 -w packages/browser
        if: matrix.node == '24'
